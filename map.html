<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Métro de Montréal</title>
<style>
  body { margin: 0; background: #000; color: #eee; font-family: sans-serif; display: flex; }
  #side { width: 240px; padding: 16px; flex-shrink: 0; }
  #clock { font-size: 36px; font-variant-numeric: tabular-nums; margin: 8px 0; }
  select, button { padding: 4px 8px; }
</style>
</head>
<body>
<div id="side">
  <h3>Métro de Montréal</h3>
  <div id="clock">--:--:--</div>
  <p id="count"></p>
  <label>Speed
    <select id="speed">
      <option value="1">1×</option>
      <option value="10">10×</option>
      <option value="60">60×</option>
      <option value="300">300×</option>
    </select>
  </label>
  <p><button id="now">Back to now</button></p>
</div>
<svg id="map" width="1000" height="1000"></svg>

<script>
const NS = "http://www.w3.org/2000/svg";
const COLORS = { "1": "#00B300", "2": "#D95700", "4": "#FFD900", "5": "#0095E6" };
const svg = document.getElementById("map");

let pos = {};      // station name -> [x, y]
let trips = [];    // from trips_today.json
let simTime = 0;   // simulated seconds since midnight
let speed = 1;
let lastFrame = performance.now();

function el(tag, attrs) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

function nowSeconds() {
  const d = new Date();
  return d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds() + d.getMilliseconds() / 1000;
}

function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  const header = lines[0].split(",");
  return lines.slice(1).map(line => {
    const values = line.split(",");
    const row = {};
    header.forEach((h, i) => row[h] = values[i]);
    return row;
  });
}

const networkLayer = el("g", {});
const trainLayer = el("g", {});
svg.appendChild(networkLayer);
svg.appendChild(trainLayer);

function drawNetwork(rows) {
  for (const route of Object.keys(COLORS)) {
    const pts = rows
      .filter(r => r.route_id === route)
      .sort((a, b) => Number(a.seq) - Number(b.seq))
      .map(r => `${r.x},${r.y}`).join(" ");
    networkLayer.appendChild(el("polyline", {
      points: pts, fill: "none", stroke: COLORS[route],
      "stroke-width": 8, "stroke-linejoin": "round", "stroke-linecap": "round"
    }));
  }
  for (const name in pos) {
    const [x, y] = pos[name];
    networkLayer.appendChild(el("circle", { cx: x, cy: y, r: 5, fill: "#fff" }));
    const label = el("text", { x: x + 9, y: y - 7, fill: "#bbb", "font-size": 10 });
    label.textContent = name.replace("Station ", "").replace(" -Zone B", "");
    networkLayer.appendChild(label);
  }
}

// Same interpolation as in the notebook, now in JavaScript
function trainPosition(trip, t) {
  const times = trip.times;
  if (t < times[0] || t > times[times.length - 1]) return null;
  for (let i = 0; i < times.length - 1; i++) {
    if (t >= times[i] && t <= times[i + 1]) {
      const a = pos[trip.stops[i]];
      const b = pos[trip.stops[i + 1]];
      if (!a || !b) return null;
      const span = times[i + 1] - times[i];
      const f = span === 0 ? 0 : (t - times[i]) / span;
      return [a[0] + f * (b[0] - a[0]), a[1] + f * (b[1] - a[1])];
    }
  }
  return null;
}

function formatTime(s) {
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = Math.floor(s % 60);
  return [h, m, sec].map(n => String(n).padStart(2, "0")).join(":");
}

function frame(now) {
  const dt = (now - lastFrame) / 1000;
  lastFrame = now;
  simTime = (simTime + dt * speed) % 86400;

  trainLayer.innerHTML = "";
  let running = 0;
  for (const trip of trips) {
    // Trips after midnight use times like 24:30:00 (= 88200 s), so also check t + 86400
    const p = trainPosition(trip, simTime) || trainPosition(trip, simTime + 86400);
    if (!p) continue;
    running++;
    trainLayer.appendChild(el("circle", {
      cx: p[0], cy: p[1], r: 8,
      fill: COLORS[trip.route], stroke: "#fff", "stroke-width": 2.5
    }));
  }

  document.getElementById("clock").textContent = formatTime(simTime);
  document.getElementById("count").textContent = `${running} trains running`;
  requestAnimationFrame(frame);
}

document.getElementById("speed").onchange = e => speed = Number(e.target.value);
document.getElementById("now").onclick = () => simTime = nowSeconds();

Promise.all([
  fetch("stations_schematic.csv").then(r => r.text()),
  fetch("trips_today.json").then(r => r.json())
]).then(([csvText, tripData]) => {
  const rows = parseCSV(csvText);
  rows.forEach(r => pos[r.stop_name] = [Number(r.x), Number(r.y)]);
  trips = tripData;
  drawNetwork(rows);
  simTime = nowSeconds();
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
