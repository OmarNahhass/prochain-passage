<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Station placer</title>
<style>
  body { font-family: sans-serif; margin: 0; display: flex; background: #111; color: #eee; }
  #side { width: 280px; padding: 12px; flex-shrink: 0; }
  svg { background: #000; cursor: crosshair; }
  button { margin: 4px 4px 4px 0; padding: 6px 10px; }
</style>
</head>
<body>
<div id="side">
  <h3>Station placer</h3>
  <p>Next: <b id="next">loading…</b></p>
  <p id="progress"></p>
  <button id="undo">Undo</button>
  <button id="save">Download CSV</button>
  <p style="font-size:12px">Clicks snap to a 20px grid. Interchange stations are reused automatically.</p>
</div>
<svg id="map" width="1000" height="1000"></svg>

<script>
const NS = "http://www.w3.org/2000/svg";
const COLORS = { "1": "#00B300", "2": "#D95700", "4": "#FFD900", "5": "#0095E6" };
const GRID = 20;
const svg = document.getElementById("map");
let stations = [];
let index = 0;
let history = [];

function el(tag, attrs) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

// Background grid
const grid = el("g", { stroke: "#222" });
for (let i = 0; i <= 1000; i += GRID) {
  grid.appendChild(el("line", { x1: i, y1: 0, x2: i, y2: 1000 }));
  grid.appendChild(el("line", { x1: 0, y1: i, x2: 1000, y2: i }));
}
svg.appendChild(grid);
const layer = el("g", {});
svg.appendChild(layer);

// Skip stations that are already placed, or copy positions from the same station on another line
function autoFill() {
  const filled = [];
  while (index < stations.length) {
    const s = stations[index];
    if (s.x !== "") { index++; continue; }
    const twin = stations.find(o => o !== s && o.stop_name === s.stop_name && o.x !== "");
    if (!twin) break;
    s.x = twin.x; s.y = twin.y;
    filled.push(index);
    index++;
  }
  return filled;
}

function draw() {
  layer.innerHTML = "";
  for (const route of Object.keys(COLORS)) {
    const pts = stations
      .filter(s => s.route_id === route && s.x !== "")
      .map(s => `${s.x},${s.y}`).join(" ");
    layer.appendChild(el("polyline", {
      points: pts, fill: "none", stroke: COLORS[route],
      "stroke-width": 8, "stroke-linejoin": "round"
    }));
  }
  const seen = new Set();
  for (const s of stations) {
    if (s.x === "") continue;
    const key = s.x + "," + s.y;
    if (seen.has(key)) continue;
    seen.add(key);
    layer.appendChild(el("circle", { cx: s.x, cy: s.y, r: 6, fill: "#fff" }));
    const label = el("text", { x: Number(s.x) + 10, y: Number(s.y) - 8, fill: "#ccc", "font-size": 11 });
    label.textContent = s.stop_name.replace("Station ", "").replace(" -Zone B", "");
    layer.appendChild(label);
  }
  const next = stations[index];
  document.getElementById("next").textContent =
    next ? `${next.stop_name} (line ${next.route_id})` : "All placed!";
  document.getElementById("progress").textContent = `${index} / ${stations.length}`;
}

svg.addEventListener("click", e => {
  if (index >= stations.length) return;
  const rect = svg.getBoundingClientRect();
  const x = Math.round((e.clientX - rect.left) / GRID) * GRID;
  const y = Math.round((e.clientY - rect.top) / GRID) * GRID;
  stations[index].x = String(x);
  stations[index].y = String(y);
  const group = [index];
  index++;
  group.push(...autoFill());
  history.push(group);
  draw();
});

document.getElementById("undo").onclick = () => {
  const group = history.pop();
  if (!group) return;
  group.forEach(i => { stations[i].x = ""; stations[i].y = ""; });
  index = group[0];
  draw();
};

document.getElementById("save").onclick = () => {
  const header = "route_id,seq,stop_name,x,y";
  const body = stations.map(s => [s.route_id, s.seq, s.stop_name, s.x, s.y].join(",")).join("\n");
  const blob = new Blob([header + "\n" + body], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "stations_schematic.csv";
  a.click();
};

// Load the CSV
fetch("stations_schematic.csv")
  .then(r => r.text())
  .then(text => {
    const lines = text.trim().split(/\r?\n/);
    const header = lines[0].split(",");
    stations = lines.slice(1).map(line => {
      const values = line.split(",");
      const row = {};
      header.forEach((h, i) => row[h] = values[i] ?? "");
      return row;
    });
    autoFill();
    draw();
  });
</script>
</body>
</html>
